name: Hent spillerpoeng

on:
  schedule:
    - cron: "17 5 * * 2"       # hver tirsdag morgen (UTC)
  workflow_dispatch:           # manuell kjøring fra Actions-fanen

permissions:
  contents: write

concurrency:
  group: player-points
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Hent poeng per spiller (faller tilbake på forrige fil hvis det feiler)
        run: |
          if python scripts/fetch_player_points.py data/player_points.new.json; then
            mv data/player_points.new.json data/player_points.json
          else
            echo "::warning::Kunne ikke hente data fra FPL - beholder forrige data/player_points.json"
            rm -f data/player_points.new.json
          fi
      - name: Lagre
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data/player_points.json
          git diff --cached --quiet || (git commit -m "Oppdater spillerpoeng" && git pull --rebase origin main && git push origin HEAD:main)
